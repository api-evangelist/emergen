aid: emergen
name: emergen
description: >-
  emergen (智昌科技集团股份有限公司, Zhichang Technology Group) is a Chinese industrial
  intelligence company founded by Dr. Gan Zhongxue, an expert in intelligent
  manufacturing. Built around its proprietary "ternary control" technology and
  cluster (swarm) robotics, the company positions itself as "AI + Control,"
  delivering integrated "industrial agent" solutions that install a control
  "brain" into individual machines, production lines, and whole factories. Its
  portfolio spans robot controllers, ubiquitous controllers, industrial and
  collaborative robots, life-science robots, GVision 2D/3D machine vision, the
  GSC-AI100 sense-compute-control AI controller, a swarm-intelligence network
  controller, a micro-control cloud platform, and the "Jiangxin" family of
  industrial large models (design, production, service, and management). emergen
  serves automotive, electronics, equipment manufacturing, steel, metallurgy,
  textile, furniture, and shipbuilding sectors, plus Robotics-as-a-Service. It
  was surfaced as a portfolio company of qiming and added to the API Evangelist
  network. As of this pass no public developer/API surface was found.
